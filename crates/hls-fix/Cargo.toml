[package]
name = "hls-fix"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HLS processing toolkit"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
m3u8-rs = { workspace = true }
hls = { path = "../hls" }
pipeline-common = { path = "../pipeline-common" }
ts = { path = "../ts" }
mp4 = { path = "../mp4" }
zlib-rs = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[features]
default = ["progress"]
# Decorate the WriterTask span with a tracing-indicatif progress bar. Off in
# headless library builds so consumers do not pull the terminal-UI dependency.
progress = ["dep:tracing-indicatif"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
bytes-util = { path = "../bytes-util" }
expgolomb = { path = "../expgolomb" }
mp4 = { path = "../mp4", features = ["test-utils"] }

syntax = "proto3";

// Minimal subset of the TikTok LIVE webcast IM protocol used by the danmu
// provider. Field numbers follow the wire format captured from the web client
// (webcast `ws_proxy` push frames); unlisted fields are skipped by prost.
package tiktok.webcast;

// Outer envelope for every WebSocket frame in both directions.
message PushFrame {
  uint64 seq_id = 1;
  uint64 log_id = 2;
  uint64 service = 3;
  uint64 method = 4;
  repeated PushHeader headers = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
}

message PushHeader {
  string key = 1;
  string value = 2;
}

// Payload of `msg` / `im_enter_room_resp` push frames.
message Response {
  repeated Message messages = 1;
  string cursor = 2;
  int64 fetch_interval = 3;
  int64 now = 4;
  string internal_ext = 5;
  int32 fetch_type = 6;
  map<string, string> route_params = 7;
  int64 heartbeat_duration = 8;
  bool need_ack = 9;
  string push_server = 10;
  bool is_first = 11;
  string history_comment_cursor = 12;
  bool history_no_more = 13;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msg_id = 3;
  int32 msg_type = 4;
  int64 offset = 5;
  bool is_history = 6;
  int32 sample_flag = 7;
}

// Payload of the outbound `hb` push frame.
message HeartBeat {
  int64 room_id = 1;
  int64 send_packet_seq_id = 2;
}

// Payload of the outbound `im_enter_room` push frame.
message EnterRoom {
  int64 room_id = 1;
  string room_tag = 2;
  string live_region = 3;
  int64 live_id = 4;
  string identity = 5;
  string cursor = 6;
  int64 account_type = 7;
  int64 enter_unique_id = 8;
  string filter_welcome_msg = 9;
  bool is_anchor_continue_keep_msg = 10;
}

message Common {
  string method = 1;
  int64 msg_id = 2;
  int64 room_id = 3;
  int64 create_time = 4;
  int32 monitor = 5;
  bool is_show_msg = 6;
  string describe = 7;
  Text display_text = 8;
  int64 fold_type = 9;
  int64 anchor_fold_type = 10;
  int64 priority_score = 11;
  string log_id = 12;
}

message Text {
  string key = 1;
  string default_pattern = 2;
  TextFormat default_format = 3;
}

message TextFormat {
  string color = 1;
  bool bold = 2;
  bool italic = 3;
}

message Image {
  repeated string url_list = 1;
  string uri = 2;
  int32 height = 3;
  int32 width = 4;
  string avg_color = 5;
}

message User {
  int64 id = 1;
  string nickname = 3;
  string bio_description = 5;
  Image avatar_thumb = 9;
  Image avatar_medium = 10;
  Image avatar_large = 11;
  bool verified = 12;
  int32 status = 15;
  string display_id = 38;
  string sec_uid = 46;
}

message ChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;
  bool visible_to_sender = 4;
  string full_screen_text_color = 6;
  int32 input_type = 11;
  User at_user = 12;
  repeated EmoteWithIndex emotes = 13;
  string content_language = 14;
}

message EmoteWithIndex {
  int32 index = 1;
  EmoteModel emote = 2;
}

message EmoteModel {
  string emote_id = 1;
  Image image = 2;
}

message EmoteChatMessage {
  Common common = 1;
  User user = 2;
  repeated EmoteModel emote_list = 3;
}

// `action`: 1 paused, 2 unpaused, 3 stream ended, 4 stream suspended.
message ControlMessage {
  Common common = 1;
  int32 action = 2;
  string tips = 3;
}

message GiftMessage {
  Common common = 1;
  int64 gift_id = 2;
  int32 fan_ticket_count = 3;
  int32 group_count = 4;
  int32 repeat_count = 5;
  int32 combo_count = 6;
  User user = 7;
  User to_user = 8;
  int32 repeat_end = 9;
  int64 group_id = 11;
  Gift gift = 15;
  string log_id = 16;
  int64 send_type = 17;
}

message Gift {
  Image image = 1;
  string describe = 2;
  int32 duration = 4;
  int64 id = 5;
  bool for_linkmic = 7;
  bool combo = 10;
  int32 type = 11;
  int32 diamond_count = 12;
  bool is_displayed_on_panel = 13;
  string name = 16;
  Image icon = 21;
}

message LikeMessage {
  Common common = 1;
  int32 count = 2;
  int64 total = 3;
  int32 color = 4;
  User user = 5;
}

message MemberMessage {
  Common common = 1;
  User user = 2;
  int32 member_count = 3;
  User operator = 4;
  bool is_set_to_admin = 5;
  bool is_top_user = 6;
  int32 rank_score = 7;
  int32 top_user_no = 8;
  int32 enter_type = 9;
  int32 action = 10;
  string action_description = 11;
  int64 user_id = 12;
}

message SocialMessage {
  Common common = 1;
  User user = 2;
  int64 share_type = 3;
  int64 action = 4;
  string share_target = 5;
  int64 follow_count = 6;
}

message RoomUserSeqMessage {
  Common common = 1;
  int64 total = 3;
  string pop_str = 4;
  int64 popularity = 6;
  int64 total_user = 7;
}

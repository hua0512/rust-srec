[workspace]
resolver = "3"

members = [
    "mesio-cli",
    "strev-cli",
    "rust-srec",
    "rust-srec/src-tauri",
    "crates/flv",
    "crates/flv-fix",
    "crates/hls",
    "crates/hls-fix",
    "crates/mesio",
    "crates/aac",
    "crates/bytes-util",
    "crates/expgolomb",
    "crates/av1",
    "crates/mp4",
    "crates/media-types",
    "crates/h265",
    "crates/h264",
    "crates/amf0",
    "crates/platforms",
    "crates/tars-codec",
    "crates/pipeline-common",
    "crates/process-utils",
    "crates/ts",
]

default-members = [
    "mesio-cli",
    "strev-cli",
    "rust-srec",
]

[workspace.package]
version = "0.7.0"
authors = ["hua0512"]
repository = "https://github.com/hua0512/rust-srec"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
arc-swap = "1"
bytes = "1.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["codec", "io", "rt", "time"] }
# Use platform certificate verification consistently with the extractor clients.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "stream", "rustls", "gzip", "deflate"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
async-trait = "0.1.92"
rand = "0.10.3"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# Chinese/Japanese word segmentation for danmu word-frequency statistics.
# `default-dict` (on by default) embeds the dictionary so no runtime file is
# needed; `tfidf`/`textrank` stay off since only segmentation is used.
jieba-rs = "0.11.0"
futures = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
prost = "0.14.4"
prost-build = "0.14.4"
parking_lot = "0.12.5"
sha2 = "0.11.1"
hex = "0.4.3"
flate2 = { version = "1.1.10", features = ["zlib-rs"], default-features = false }
url = "2.5.8"
anyhow = "1.0.104"
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "fs"] }
tempfile = "3.27.0"
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "macros", "uuid", "chrono", "json"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
rmcp = { version = "3.6.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lettre = { version = "0.11.23", default-features = false, features = ["aws-lc-rs", "builder", "pool", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
mimalloc = "0.1.52"
argon2 = "0.6.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4.46"
chrono-tz = "0.10.4"
cron = "0.17"
dotenvy = "0.15.7"
# Health sampling and disk maintenance use only CPU/memory and disk inventory.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tracing-appender = "0.2.5"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
m3u8-rs = "6.0.1"
md-5 = "0.11.0"
base64 = "0.23.1"
byteorder = "1.5"
brotli = "9.0"
openssl = { version = "0.10.81", features = ["vendored"] }
native-tls = "0.2.18"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "aws-lc-rs", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false }
libsm = "0.6.1"
rustc-hash = "2.1.3"
memchr = "2.8.3"
criterion = "0.8.2"
zlib-rs = "0.6.8"
aes = "0.9.3"
cbc = "0.2.1"
cipher = "0.5.2"
indicatif = "0.18.6"
insta = "1.49.0"
tracing-indicatif = "0.3.14"
dashmap = "6.2.1"
rust-i18n = "4"
aes-gcm = "0.11.1"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
tower = { version = "0.5.3", features = ["util"] }
roxmltree = "0.21.1"

[profile.dev]
incremental = true
strip = false
lto = false
opt-level = 0

[profile.dev.package."*"]
opt-level = 0
incremental = true

[profile.dev.build-override]
opt-level = 0
incremental = true

[profile.dev.package.sqlx-macros]
opt-level = 3

# An unoptimized Argon2id verify of a stored password takes about half a
# second, 20x the optimized one, and every login in a debug build or test pays
# it. Its BLAKE2 dependency makes no measurable difference.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# The daemon isolates panicking tasks and finalizes active recordings during
# graceful shutdown, both of which require unwinding.
debug = false

# Standalone CLIs can opt back into aborting panics for smaller binaries, for
# example: `cargo build -p strev --profile release-cli`.
[profile.release-cli]
inherits = "release"
panic = "abort"

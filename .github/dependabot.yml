# Basic `dependabot.yml` file with
# minimal configuration for the repo's package managers

version: 2
updates:
  - package-ecosystem: "cargo"
    # Rust workspace dependencies
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Held dependencies documented in AGENTS.md.
    ignore:
      - dependency-name: "cc"
        versions: ["> 1.8.0"]
      - dependency-name: "parking_lot"
        versions: [">= 0.13.0"]
      - dependency-name: "notify-rust"
        versions: [">= 4.19.0"]
      - dependency-name: "wry"
        versions: [">= 0.57.2"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend (pnpm via npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/rust-srec/frontend"
    schedule:
      interval: "weekly"
    groups:
      # TanStack Start, Router, and Router Plugin must move together.
      tanstack:
        patterns:
          - "@tanstack/*"
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docs site (npm)
  - package-ecosystem: "npm"
    directory: "/rust-srec/docs"
    schedule:
      interval: "weekly"

  # Container images
  - package-ecosystem: "docker"
    directory: "/rust-srec"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/rust-srec/frontend"
    schedule:
      interval: "weekly"

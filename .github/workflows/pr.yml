name: Pull Request CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.13.0"
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - name: Install Linux TLS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-clippy
          save-if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Clippy check
        run: cargo clippy --locked --workspace --exclude rust-srec-desktop --all-targets --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback -- -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  rustdoc:
    name: Rustdoc
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - name: Install Linux TLS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-rustdoc
          save-if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Check private-item rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --exclude rust-srec-desktop --all-features --no-deps --document-private-items

  test:
    name: Test Suite
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
          - os: windows-latest
          - os: macos-15-intel
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable sccache
        if: runner.os != 'macOS' || runner.arch == 'ARM64'
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: runner.os != 'macOS' || runner.arch == 'ARM64'
        with:
          version: "v0.13.0"
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/setup-protoc
      - name: Install Linux TLS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-test
          save-if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Run tests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop
      - name: Run doctests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --exclude rust-srec-desktop --doc --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback
      - name: sccache stats
        if: always() && (runner.os != 'macOS' || runner.arch == 'ARM64')
        run: sccache --show-stats || true

  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      systemd: ${{ steps.filter.outputs.systemd }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-srec/Cargo.toml'
              - 'rust-srec/src/**'
              - 'rust-srec/tests/**'
              - 'rust-srec/src-tauri/**'
              - '.github/workflows/pr.yml'
            frontend:
              - 'rust-srec/frontend/**'
            desktop:
              - 'rust-srec/src-tauri/**'
              - 'rust-srec/src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            systemd:
              - 'rust-srec/rust-srec.service'
              - '.github/workflows/pr.yml'

  systemd-unit:
    name: systemd Unit
    needs: check-changes
    if: needs.check-changes.outputs.systemd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # systemd-analyze verify resolves ExecStart= on the local file system, so
      # the unit's install path needs an executable before the check runs.
      - name: Stage the ExecStart target
        run: sudo install -D -m 0755 /bin/true /opt/rust-srec/rust-srec
      # TEMPORARY: report how this runner's systemd treats --recursive-errors,
      # so the flag the next step relies on is confirmed rather than assumed.
      - name: Probe runner systemd behaviour
        run: bash .github/scripts/systemd-verify-probe.sh
      # Without --recursive-errors=, verify "returns zero as the exit status
      # regardless whether warnings arise" (systemd-analyze(1)) — a misplaced
      # key, an unparseable value or an unknown syscall group is only a warning
      # on stderr. `no` scopes both the warnings and the exit status to this
      # file, so those defects fail the step while warnings about unrelated
      # units the runner image pulls in through Wants=/After= do not.
      - name: Verify the systemd unit
        run: systemd-analyze verify --recursive-errors=no rust-srec/rust-srec.service

  frontend-lint:
    name: Frontend Lint
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-srec/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: rust-srec/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Run lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
      - name: Run build
        run: pnpm run build

  desktop-build:
    name: Desktop Debug Build (no bundle)
    needs: check-changes
    if: needs.check-changes.outputs.desktop == 'true'
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.13.0"
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-desktop-debug
          save-if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: rust-srec/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm -C rust-srec/frontend install --frozen-lockfile

      - uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          projectPath: rust-srec/src-tauri
          args: --debug --no-bundle
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

name: Pull Request CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let main finish populating caches even when another push only changes docs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: ./.github/actions/setup-linux-deps
        with:
          packages: pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-clippy
          # PR merge-ref caches cannot be reused by other PRs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy check
        run: cargo clippy --locked --workspace --exclude rust-srec-desktop --all-targets --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback -- -D warnings
      # Test targets turn on the srec crates' `test-support` feature, so the
      # check above never sees the release build. This is the release
      # workflow's Clippy step.
      - name: Clippy check (release features)
        shell: bash
        run: |
          set -euo pipefail
          packages=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].name | select(. == "rust-srec" or startswith("srec-")) | "-p " + .] | join(" ")')
          cargo clippy $packages --locked --features rust-srec/tls-native-fallback -- -D warnings

  rustdoc:
    name: Rustdoc
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-linux-deps
        with:
          packages: pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-rustdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check private-item rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --exclude rust-srec-desktop --all-features --no-deps --document-private-items

  test:
    name: Test Suite
    needs: check-changes
    if: needs.check-changes.outputs.rust == 'true'
    strategy:
      # Each platform reports its own result: a failure on one must not
      # cancel the others, some of which are required to merge.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, windows-latest, macos-15-intel, macos-latest]
        exclude:
          # Intel macOS runs after merge only. The account runs at most five
          # macOS jobs at once, and an Intel job on every pull request kept
          # macos-latest, the slowest platform a merge waits for, queued for a runner.
          - os: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # macOS runners vary in CPU and memory, and test time varies with them.
      - name: Show macOS runner resources
        if: runner.os == 'macOS'
        run: sysctl hw.ncpu hw.memsize vm.swapusage
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: rust-srec/tests/e2e/streamlink-requirements.txt
      - uses: ./.github/actions/setup-linux-deps
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: pkg-config libssl-dev ffmpeg rclone
      - name: Install test-only Streamlink
        if: matrix.os == 'ubuntu-latest'
        run: 'python -m pip install --only-binary=:all: -r rust-srec/tests/e2e/streamlink-requirements.txt'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback
      # Keep the workspace and features identical to reuse the normal test build.
      # Every ignored backend test runs except the SQLite stress test and open bugs.
      - name: Run ffmpeg, rclone, and Streamlink gated tests
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback --run-ignored ignored-only -E 'package(/^(rust-srec|srec-.+)$/) and not test(/^sqlite_claim_stress::/) and not test(/known_bug_/)'
      # Hosted Apple Silicon macOS runners have 7 GB RAM; compiling rust-srec's
      # library and unit-test harness concurrently exhausts RAM and thrashes
      # compressed memory. Build integration tests (`--test '*'`, which compiles
      # the library without the unit-test harness) first on ARM64 macOS so the
      # two heavy compilations run sequentially. Intel macOS runners have 14 GB
      # RAM and stay faster in a single parallel pass.
      - name: Build integration tests (macOS ARM64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: cargo nextest run --no-run --locked --workspace --exclude rust-srec-desktop --test '*' --timings
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop --timings
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' && runner.os != 'macOS'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop
      - name: Run doctests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --exclude rust-srec-desktop --doc --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback
      - name: Upload macOS build timings
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      systemd: ${{ steps.filter.outputs.systemd }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On main pushes, compare with the commit before the push.
          base: main
          filters: |
            rust:
              - 'crates/**'
              - 'mesio-cli/**'
              - 'strev-cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'rust-srec/Cargo.toml'
              - 'rust-srec/crates/**'
              - 'rust-srec/proto/**'
              - 'rust-srec/migrations/**'
              - 'rust-srec/src/**'
              - 'rust-srec/tests/**'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-linux-deps/**'
              - '.github/workflows/pr.yml'
            frontend:
              - 'rust-srec/frontend/**'
              - 'rust-srec/proto/**'
              - '.github/workflows/pr.yml'
            desktop:
              - 'rust-srec/src-tauri/**'
              - 'rust-srec/Cargo.toml'
              - 'rust-srec/crates/**'
              - 'rust-srec/proto/**'
              - 'rust-srec/migrations/**'
              - 'rust-srec/src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/pr.yml'
              - '.github/workflows/release-rust-srec.yml'
            systemd:
              - 'rust-srec/rust-srec.service'
              - '.github/workflows/pr.yml'

  systemd-unit:
    name: systemd Unit
    needs: check-changes
    if: needs.check-changes.outputs.systemd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # systemd-analyze verify resolves ExecStart= on the local file system, so
      # the unit's install path needs an executable before the check runs.
      - name: Stage the ExecStart target
        run: sudo install -D -m 0755 /bin/true /opt/rust-srec/rust-srec
      # Without --recursive-errors=, verify "returns zero as the exit status
      # regardless whether warnings arise" (systemd-analyze(1)) — a misplaced
      # key, an unparseable value or an unknown syscall group is only a warning
      # on stderr. `no` scopes both the warnings and the exit status to this
      # file, so those defects fail the step while warnings about unrelated
      # units the runner image pulls in through Wants=/After= do not.
      - name: Verify the systemd unit
        run: systemd-analyze verify --recursive-errors=no rust-srec/rust-srec.service

  frontend-lint:
    name: Frontend Lint
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-srec/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: rust-srec/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Run lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
      - name: Run build
        run: pnpm run build
      - name: Run desktop frontend build
        run: pnpm run build:desktop

  desktop-build:
    name: Desktop Debug Build (no bundle)
    needs: check-changes
    if: needs.check-changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-desktop-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `src-tauri/build.rs` creates `../frontend/dist-desktop` when absent, so
      # compiling the Tauri wrapper does not require building the frontend here
      # (frontend-lint already verifies `pnpm run build:desktop` on Linux).
      - name: Clippy desktop crate
        run: cargo clippy --locked -p rust-srec-desktop --all-targets -- -D warnings
      - name: Test desktop crate
        run: cargo test --locked -p rust-srec-desktop
      - name: Build desktop crate
        run: cargo build --locked -p rust-srec-desktop

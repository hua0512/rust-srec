name: Dev CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    if: github.repository == 'hua0512/rust-srec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: ./.github/actions/setup-linux-deps
        with:
          packages: pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Main populates the same dependency cache used by PR checks.
          shared-key: pr-clippy
          save-if: false
      - name: Clippy check
        run: cargo clippy --locked --workspace --exclude rust-srec-desktop --all-targets --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback -- -D warnings

  test:
    name: Test Suite
    if: github.repository == 'hua0512/rust-srec'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
          - os: windows-latest
          - os: macos-15-intel
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/setup-linux-deps
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-test
          save-if: false
      - name: Run tests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback
      # Hosted macOS runners have 7 GB RAM; build integration tests (`--test '*'`,
      # which compiles the library without the unit-test harness) before running
      # the full suite to avoid memory thrashing.
      - name: Build integration tests (macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --no-run --locked --workspace --exclude rust-srec-desktop --test '*'
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude rust-srec-desktop
      - name: Run doctests (backend only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --exclude rust-srec-desktop --doc --features rust-srec/tls-native-fallback,platforms-parser/tls-native-fallback,mesio-engine/tls-native-fallback,strev/tls-native-fallback,mesio/tls-native-fallback

  build:
    needs: clippy
    if: github.repository == 'hua0512/rust-srec'
    uses: ./.github/workflows/build-binaries.yml
    with:
      packages: '-p mesio -p strev -p rust-srec --bins'
      profile: 'release-dev'
      features_normal: 'mesio/tls-native-fallback,strev/tls-native-fallback,rust-srec/tls-native-fallback'
      features_musl: 'mesio/static-ssl,strev/static-ssl,rust-srec/static-ssl'
      binaries: '["mesio", "strev", "rust-srec", "rust-srec-vapid"]'

  docker-build:
    name: Build Docker
    needs: clippy
    if: github.repository == 'hua0512/rust-srec'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rust-srec/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            CARGO_PROFILE=release-dev
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/rust-srec,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec:buildcache-dev-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec:buildcache-release-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec:buildcache-dev-${{ env.PLATFORM_PAIR }},mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      
      - name: Export digest backend
        run: |
          mkdir -p /tmp/digests/backend
          digest="${{ steps.build-backend.outputs.digest }}"
          touch "/tmp/digests/backend/${digest#sha256:}"
      
      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./rust-srec/frontend
          file: rust-srec/frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/rust-srec-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec-frontend:buildcache-dev-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec-frontend:buildcache-release-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rust-srec-frontend:buildcache-dev-${{ env.PLATFORM_PAIR }},mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true

      - name: Export digest frontend
        run: |
          mkdir -p /tmp/digests/frontend
          digest="${{ steps.build-frontend.outputs.digest }}"
          touch "/tmp/digests/frontend/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Merge Docker
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.repository == 'hua0512/rust-srec'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push backend
        working-directory: /tmp/digests/backend
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/rust-srec:dev \
            $(printf 'ghcr.io/${{ github.repository_owner }}/rust-srec@sha256:%s ' *)
      
      - name: Create manifest list and push frontend
        working-directory: /tmp/digests/frontend
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/rust-srec-frontend:dev \
            $(printf 'ghcr.io/${{ github.repository_owner }}/rust-srec-frontend@sha256:%s ' *)

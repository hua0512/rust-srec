name: strev Release

on:
  push:
    tags:
      - "strev-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # Only main saves compiler caches. A release saved several GB under its tag,
  # which no later run reads, and evicted the main caches pull requests use.
  SCCACHE_GHA_RW_MODE: READ_ONLY

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Main saves this cache from the Linux Test Suite job in pr.yml.
          shared-key: pr-test
          save-if: false
      - name: Check
        run: cargo check -p strev --locked --features tls-native-fallback
      - name: Clippy
        run: cargo clippy -p strev --locked --features tls-native-fallback -- -D warnings
      - name: Test
        run: cargo nextest run -p strev --locked --features tls-native-fallback --no-tests=pass
      - name: Doctests
        run: cargo test -p strev --locked --doc --features tls-native-fallback
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  build:
    needs: check-and-test
    uses: ./.github/workflows/build-binaries.yml
    with:
      packages: '-p strev'
      profile: 'release-cli'
      binaries: '["strev"]'

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

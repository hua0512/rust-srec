[package]
name = "rust-srec-desktop"
version.workspace = true
description = "rust-srec desktop app (Tauri)"
authors = ["hua0512"]
license.workspace = true
repository = "https://github.com/hua0512/rust-srec"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rust_srec_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
hex = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
tracing-appender = { workspace = true }
log = "0.4.34"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tokio = { workspace = true }
tokio-util = { workspace = true }
rust-srec = { path = ".." }

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18.2"
windows-registry = "0.100.0"

[features]
# Managed by the Tauri CLI.
# When enabled, Tauri serves assets via the custom protocol instead of expecting a dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Opt-in: enables Web inspector and related APIs. Avoid shipping this in release builds.
devtools = ["tauri/devtools"]

services:
  rust-srec:
    image: ghcr.io/hua0512/rust-srec:${VERSION:-latest}
    container_name: rust-srec
    restart: unless-stopped
    stop_grace_period: ${RUST_SREC_CONTAINER_STOP_GRACE_PERIOD:-35s}
    # Watchtower auto-update (only in effect when the optional `autoupdate`
    # profile is running): the pre-update hook gates updates on
    # /api/health/idle so a restart never interrupts a recording or a
    # running pipeline job.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/app/watchtower-pre-update.sh"
    ports:
      - "${API_PORT:-12555}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${CONFIG_DIR:-./config}:/app/config
      - ${OUTPUT_DIR:-./output}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
      - /tmp:/tmp
    environment:
      - TZ=${TZ:-UTC}
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/rust-srec.db}
      - RUST_SREC_SHUTDOWN_TIMEOUT_SECS=${RUST_SREC_SHUTDOWN_TIMEOUT_SECS:-30}
      - RUST_SREC_SHUTDOWN_FORCE_RESERVE_SECS=${RUST_SREC_SHUTDOWN_FORCE_RESERVE_SECS:-2}
      # Empty = derive a marker path beside DATABASE_URL's SQLite file.
      - RUST_SREC_RUNTIME_MARKER_PATH=${RUST_SREC_RUNTIME_MARKER_PATH:-}
      - OUTPUT_DIR=/app/output
      - API_PORT=8080
      - API_BIND_ADDRESS=0.0.0.0
      # Output-root write gate (#508). Empty = auto-discover from config.
      - RUST_SREC_OUTPUT_ROOTS=${RUST_SREC_OUTPUT_ROOTS:-}
      # Backend locale for notification strings (en | zh-CN).
      - RUST_SREC_LOCALE=${RUST_SREC_LOCALE:-en}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=${JWT_ISSUER:-rust-srec}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-rust-srec-api}
      # Token Expiration
      - ACCESS_TOKEN_EXPIRATION_SECS=${ACCESS_TOKEN_EXPIRATION_SECS:-3600}
      - REFRESH_TOKEN_EXPIRATION_SECS=${REFRESH_TOKEN_EXPIRATION_SECS:-604800}
      # Password Policy
      - MIN_PASSWORD_LENGTH=${MIN_PASSWORD_LENGTH:-8}
      # Browser Notifications (Web Push / VAPID)
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT:-}
      # Proxy Configuration
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "${CPU_LIMIT:-4}"
    #       memory: ${MEMORY_LIMIT:-4G}
    #     reservations:
    #       cpus: "${CPU_RESERVATION:-1}"
    #       memory: ${MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    image: ghcr.io/hua0512/rust-srec-frontend:${VERSION:-latest}
    container_name: rust-srec-frontend
    restart: unless-stopped
    # Watchtower auto-update: same idle gate as the backend so both images
    # move to the new version in the same cycle (avoids version skew).
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'wget -q -O /dev/null http://rust-srec:8080/api/health/idle || exit 75'"
    ports:
      - "${FRONTEND_PORT:-15275}:80"
    environment:
      - TZ=${TZ:-UTC}
      - BACKEND_URL=${BACKEND_URL:-http://rust-srec:8080}
      # Session cookie configuration
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required (min 32 chars)}
      # Cookie secure flag: 'true' = always, 'false' = never, omit for auto-detection via X-Forwarded-Proto
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    depends_on:
      rust-srec:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Automatic image updates (opt-in): start with
  #   docker compose --profile autoupdate up -d
  # Requires a mutable image tag (VERSION=latest or dev). Updates are gated
  # by each service's pre-update hook: containers are only recreated when
  # /api/health/idle reports no recording and no running pipeline job.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: rust-srec-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only manage containers with com.centurylinklabs.watchtower.enable=true.
      - WATCHTOWER_LABEL_ENABLE=true
      # Run the pre-update hooks that implement the idle gate.
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      # Remove superseded images after an update.
      - WATCHTOWER_CLEANUP=true
      # Seconds between update checks.
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      # Stop timeout; must exceed the backend's 30s graceful-shutdown budget.
      - WATCHTOWER_TIMEOUT=60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  default:
    name: rust-srec-network

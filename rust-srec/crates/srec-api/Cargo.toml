[package]
name = "srec-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "REST API, WebSocket/Protobuf transport, OpenAPI, MCP server, authentication, logging, and health metrics for rust-srec"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
jsonwebtoken = { workspace = true }
parking_lot = { workspace = true }
pipeline-common = { path = "../../../crates/pipeline-common" }
platforms-parser = { path = "../../../crates/platforms" }
process-utils = { path = "../../../crates/process-utils" }
prost = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
srec-core = { workspace = true }
srec-notify = { workspace = true }
srec-pipeline = { workspace = true }
srec-processors = { workspace = true }
srec-recorder = { workspace = true }
srec-sqlite = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "parking_lot"] }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }
srec-pipeline = { workspace = true, features = ["test-support"] }
srec-recorder = { workspace = true, features = ["test-support"] }
srec-sqlite = { workspace = true, features = ["test-support"] }
syn = { version = "3", features = ["full", "visit"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
zip = { workspace = true }

[features]
default = []
static-ssl = ["platforms-parser/static-ssl", "srec-recorder/static-ssl"]
tls-native-fallback = ["platforms-parser/tls-native-fallback", "srec-recorder/tls-native-fallback"]
test-support = ["srec-sqlite/test-support"]

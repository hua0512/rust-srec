[package]
name = "srec-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Post-processing DAG scheduler, job queue, worker pools, and persistence for rust-srec"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
srec-core = { workspace = true }
srec-processors = { workspace = true }
srec-sqlite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
process-utils = { path = "../../../crates/process-utils" }
srec-sqlite = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
test-support = ["srec-sqlite/test-support"]

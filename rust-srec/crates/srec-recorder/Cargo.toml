[package]
name = "srec-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Recording control plane, streamer monitoring, download orchestration, danmu service, credentials, proxies, and configuration for rust-srec"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
pipeline-common = { path = "../../../crates/pipeline-common" }
platforms-parser = { path = "../../../crates/platforms" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
srec-core = { workspace = true }
srec-engines = { workspace = true }
srec-sqlite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
srec-sqlite = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
static-ssl = ["platforms-parser/static-ssl", "srec-engines/static-ssl"]
tls-native-fallback = ["platforms-parser/tls-native-fallback", "srec-engines/tls-native-fallback"]
test-support = ["srec-sqlite/test-support"]

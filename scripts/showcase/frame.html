<!doctype html>
<!--
  Wraps a raw page capture in a macOS-style window. capture.mjs fills
  #shot, #title and the data-theme attribute, then screenshots #stage.
-->
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: transparent;
        font-family:
          'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
      }
      #stage {
        display: inline-block;
        padding: 72px 88px 96px;
        background:
          radial-gradient(
            120% 90% at 0% 0%,
            #f16529 0%,
            rgba(241, 101, 41, 0) 55%
          ),
          radial-gradient(
            110% 90% at 100% 100%,
            #7c3aed 0%,
            rgba(124, 58, 237, 0) 60%
          ),
          linear-gradient(135deg, #2a1b3d 0%, #1a1530 100%);
      }
      [data-theme='light'] #stage {
        background:
          radial-gradient(
            120% 90% at 0% 0%,
            #ffb38a 0%,
            rgba(255, 179, 138, 0) 55%
          ),
          radial-gradient(
            110% 90% at 100% 100%,
            #c4b5fd 0%,
            rgba(196, 181, 253, 0) 60%
          ),
          linear-gradient(135deg, #fde7da 0%, #e9e3ff 100%);
      }
      #stage.bare {
        padding: 36px;
        background: transparent;
      }
      .window {
        border-radius: 12px;
        overflow: hidden;
        background: #1e1e22;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.6),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.14),
          0 2px 6px rgba(0, 0, 0, 0.18),
          0 24px 48px -8px rgba(0, 0, 0, 0.38),
          0 48px 96px -24px rgba(0, 0, 0, 0.45);
      }
      [data-theme='light'] .window {
        background: #ececec;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.22),
          0 2px 6px rgba(0, 0, 0, 0.08),
          0 24px 48px -8px rgba(0, 0, 0, 0.2),
          0 48px 96px -24px rgba(0, 0, 0, 0.25);
      }
      .titlebar {
        position: relative;
        height: 38px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: linear-gradient(#2c2c31, #26262b);
        border-bottom: 1px solid rgba(0, 0, 0, 0.55);
      }
      [data-theme='light'] .titlebar {
        background: linear-gradient(#f2f2f2, #e6e6e6);
        border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      }
      .lights {
        display: flex;
        gap: 8px;
      }
      .lights span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
      .lights span:nth-child(1) {
        background: #ff5f57;
      }
      .lights span:nth-child(2) {
        background: #febc2e;
      }
      .lights span:nth-child(3) {
        background: #28c840;
      }
      #title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.72);
        pointer-events: none;
      }
      [data-theme='light'] #title {
        color: rgba(0, 0, 0, 0.7);
      }
      #shot {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="window">
        <div class="titlebar">
          <div class="lights"><span></span><span></span><span></span></div>
          <div id="title">Rust-srec</div>
        </div>
        <img id="shot" alt="" />
      </div>
    </div>
  </body>
</html>
